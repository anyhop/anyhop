name: Dependabot automerge

on:
  workflow_run:
    workflows: [CI]
    types: [requested]
  push:
    branches: [main]

# Merge verification runs once per immutable head; refresh runs serialize
# behind each other so a cascade of merges never races itself.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha || 'refresh' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `workflow_run` has a write-capable token, so never check out or run
      # code from the PR. Trust only GitHub API data and exact immutable SHAs.
      - name: Verify Dependabot identity
        id: verify
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # the whole array as JSON: indexing happens in jq below, not in an
          # expression the workflow schema cannot type-check
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(jq -r '.[0].number // empty' <<<"$PULL_REQUESTS")
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this workflow run"
            exit 0
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if [[ $(jq -r .state <<<"$pr") != open ]] ||
             [[ $(jq -r .user.login <<<"$pr") != 'dependabot[bot]' ]] ||
             [[ $(jq -r .base.ref <<<"$pr") != "$BASE_REF" ]] ||
             [[ $(jq -r .head.repo.full_name <<<"$pr") != "$GITHUB_REPOSITORY" ]] ||
             [[ $(jq -r .head.sha <<<"$pr") != "$HEAD_SHA" ]]; then
            echo "PR identity or immutable head no longer matches"
            exit 0
          fi

          commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100")
          if ! jq -e 'length == 1 and .[0].author.login == "dependabot[bot]"' \
              <<<"$commits" >/dev/null; then
            echo "PR contains a commit not authored by Dependabot"
            exit 0
          fi

          echo "merge=true" >>"$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >>"$GITHUB_OUTPUT"

      - name: Approve the verified update
        if: steps.verify.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
        run: |
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve \
            --body "Dependabot identity verified; required checks gate auto-merge."

      - name: Enable auto-merge for the verified head
        if: steps.verify.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto \
            --squash --match-head-commit "$HEAD_SHA"

  # Branch protection requires PRs to be up to date with main, but nothing in
  # GitHub updates a behind branch on its own: the moment one Dependabot PR
  # merges, its siblings go BEHIND and their armed auto-merges stall until
  # someone updates them by hand. So every push to main, refresh the siblings:
  # merging main into the branch re-runs the required checks against the new
  # merge preview and the armed auto-merge finishes without intervention.
  # The API only creates a merge commit server-side—it never executes code
  # from the PR—so it is safe to call from this privileged workflow.
  refresh:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update behind Dependabot branches onto the new main
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only PRs with auto-merge armed: anything else is already held by
          # a failed check or an identity mismatch this workflow must not
          # paper over. Only BEHIND branches need the update—DIRTY needs a
          # Dependabot rebase, BLOCKED is still checking, CLEAN merges alone.
          while read -r pr_number head_sha; do
            [[ -n "$pr_number" ]] || continue
            state=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json mergeStateStatus --jq .mergeStateStatus)
            [[ "$state" == BEHIND ]] || continue
            # expected_head_sha makes the update atomic with the state we
            # just inspected; a 422 here means the PR moved underneath us
            # and the next push will catch it.
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/update-branch" \
                -f expected_head_sha="$head_sha" >/dev/null; then
              echo "updated #$pr_number onto $BASE_REF"
            else
              echo "skipped #$pr_number: branch moved or conflicts; leaving it to Dependabot" >&2
            fi
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" \
            --author 'app/dependabot' --state open --limit 100 \
            --json number,headRefOid,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.headRefOid)"')
