name: Dependabot automerge

# Arm auto-merge on a verified Dependabot PR and let the required checks
# decide. There is deliberately no job here that refreshes behind branches,
# because `main` deliberately does not require branches to be up to date
# (protection `strict: false`). That pairing is load-bearing: with `strict`
# on, every merge pushes its siblings BEHIND, and Actions cannot get them
# green again unaided — an update-branch call by GITHUB_TOKEN is attributed
# to github-actions[bot], so the checks it triggers park at action_required
# and wait for a human. A refresh job here stalled the queue for exactly
# that reason. Dependabot rebases its own stale PRs anyway.
#
# The trade this accepts: a PR's checks ran against main as of its own head,
# not against the result of merging it. If that guarantee is ever wanted
# back, use a merge queue — do not reintroduce `strict` plus a refresh job.

on:
  workflow_run:
    workflows: [CI]
    types: [requested]

# Merge verification runs once per immutable head.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

# GitHub's enablePullRequestAutoMerge mutation is a merge operation: the
# Actions token needs both pull-requests: write and contents: write even though
# this workflow only arms auto-merge and never pushes a commit itself.
permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `workflow_run` has a write-capable token, so never check out or run
      # code from the PR. Trust only GitHub API data and exact immutable SHAs.
      - name: Verify Dependabot identity
        id: verify
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # the whole array as JSON: indexing happens in jq below, not in an
          # expression the workflow schema cannot type-check
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(jq -r '.[0].number // empty' <<<"$PULL_REQUESTS")
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this workflow run"
            exit 0
          fi

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if [[ $(jq -r .state <<<"$pr") != open ]] ||
             [[ $(jq -r .user.login <<<"$pr") != 'dependabot[bot]' ]] ||
             [[ $(jq -r .base.ref <<<"$pr") != "$BASE_REF" ]] ||
             [[ $(jq -r .head.repo.full_name <<<"$pr") != "$GITHUB_REPOSITORY" ]] ||
             [[ $(jq -r .head.sha <<<"$pr") != "$HEAD_SHA" ]]; then
            echo "PR identity or immutable head no longer matches"
            exit 0
          fi

          commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100")
          if ! jq -e 'length == 1 and .[0].author.login == "dependabot[bot]"' \
              <<<"$commits" >/dev/null; then
            echo "PR contains a commit not authored by Dependabot"
            exit 0
          fi

          echo "merge=true" >>"$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >>"$GITHUB_OUTPUT"

      # No approval step: `main` does not require reviews, and since the repo
      # moved into the anyhop org the org policy forbids GITHUB_TOKEN from
      # approving at all ("GitHub Actions is not permitted to approve pull
      # requests"). It used to succeed under the personal account, and its
      # failure silently skipped the arming step below — nothing merged.
      # The identity check above plus the required checks are the whole gate.
      - name: Enable auto-merge for the verified head
        if: steps.verify.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.verify.outputs.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto \
            --rebase --match-head-commit "$HEAD_SHA"
